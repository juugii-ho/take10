<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAKE10 — Viewer Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111214;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    /* ---- Control Bar ---- */
    #bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 50;
    }

    .btn {
      background: rgba(20, 22, 28, 0.88);
      color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      background: rgba(50, 55, 68, 0.9);
      color: #e5e7eb;
    }
    .btn.active {
      border-color: #5aa9e6;
      color: #5aa9e6;
    }

    .sep {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.1);
    }

    #btn-play {
      min-width: 88px;
    }
    #btn-rec {
      color: #e74c3c;
      border-color: rgba(231,76,60,0.4);
    }
    #btn-rec:hover {
      background: rgba(80, 20, 20, 0.9);
      color: #ff6b6b;
    }
    #btn-rec:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---- Tick scrubber ---- */
    #scrubber-wrap {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }
    #scrubber {
      -webkit-appearance: none;
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #5aa9e6;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(90,169,230,0.6);
    }
    #tick-label {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
      min-width: 60px;
    }

    /* ---- Title ---- */
    #title-tag {
      position: fixed;
      top: 16px;
      right: 18px;
      color: rgba(255,255,255,0.22);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 50;
    }

    /* ---- Loading ---- */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111214;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.1em;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="loading">LOADING SCENE…</div>
  <div id="viewer"></div>

  <div id="title-tag">TAKE10 · VIEWER</div>

  <div id="scrubber-wrap">
    <input type="range" id="scrubber" min="0" step="1" value="0">
    <span id="tick-label">TICK 0</span>
  </div>

  <div id="bar">
    <button class="btn active" id="btn-wide"    onclick="doShot('wide')">Wide</button>
    <button class="btn"        id="btn-closeup" onclick="doShot('closeup')">Close-up</button>
    <button class="btn"        id="btn-ots"     onclick="doShot('ots')">Over-shoulder</button>
    <button class="btn"        id="btn-top"     onclick="doShot('top')">Top</button>
    <button class="btn"        id="btn-free"    onclick="doShot('free')">Free</button>
    <div class="sep"></div>
    <button class="btn" id="btn-play" onclick="togglePlay()">▶ Play</button>
    <div class="sep"></div>
    <button class="btn" id="btn-rec" onclick="startRecord()">● Record 10s</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <script type="module">
    import { createViewer } from './viewer.js';

    const data = await fetch('./sample_take.json').then(r => r.json());
    const ticks = data.take.ticks;

    const container = document.getElementById('viewer');
    const scrubber  = document.getElementById('scrubber');
    const tickLabel = document.getElementById('tick-label');
    const loading   = document.getElementById('loading');

    scrubber.max = ticks.length - 1;

    let isPlaying = false;
    let scrubbing = false;

    const viewer = createViewer(container, data, {
      loop: true,
      onTick(t) {
        const idx = ticks.findIndex(tk => tk.t === t);
        if (!scrubbing) {
          scrubber.value = idx >= 0 ? idx : 0;
          tickLabel.textContent = `TICK ${t}`;
        }
      },
    });

    // Hide loading
    loading.style.display = 'none';

    // ---- Shot buttons ----
    window.doShot = (name) => {
      document.querySelectorAll('.btn[id^="btn-"]').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btn-' + name);
      if (btn) btn.classList.add('active');
      viewer.setShot(name === 'free' ? 'wide' : name);
      // "free" just sets wide first; user drags to unlock
    };

    // ---- Play / Pause ----
    window.togglePlay = () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play');
      if (isPlaying) {
        viewer.play();
        btn.textContent = '⏸ Pause';
      } else {
        viewer.pause();
        btn.textContent = '▶ Play';
      }
    };

    // ---- Scrubber ----
    scrubber.addEventListener('mousedown', () => { scrubbing = true; });
    scrubber.addEventListener('touchstart', () => { scrubbing = true; });
    scrubber.addEventListener('input', () => {
      const idx = parseInt(scrubber.value, 10);
      tickLabel.textContent = `TICK ${ticks[idx]?.t ?? idx}`;
      viewer.seek(ticks[idx]?.t ?? idx);
    });
    scrubber.addEventListener('mouseup', () => { scrubbing = false; });
    scrubber.addEventListener('touchend', () => { scrubbing = false; });

    // ---- Record ----
    window.startRecord = async () => {
      const btn = document.getElementById('btn-rec');
      btn.textContent = '⏺ Recording…';
      btn.disabled = true;

      // Auto-play while recording
      const wasPlaying = isPlaying;
      if (!isPlaying) {
        isPlaying = true;
        viewer.play();
        document.getElementById('btn-play').textContent = '⏸ Pause';
      }

      let blob;
      try {
        blob = await viewer.record(10);
      } catch (err) {
        console.error('Record failed:', err);
        btn.textContent = '● Record 10s';
        btn.disabled = false;
        return;
      }

      // Download
      const url  = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `take${data.take.n}_shot.webm`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      btn.textContent = '● Record 10s';
      btn.disabled = false;
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); window.togglePlay(); }
      if (e.key === '1') window.doShot('wide');
      if (e.key === '2') window.doShot('closeup');
      if (e.key === '3') window.doShot('ots');
      if (e.key === '4') window.doShot('top');
      if (e.key === '5') window.doShot('free');
    });
  </script>
</body>
</html>
